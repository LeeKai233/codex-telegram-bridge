[workspace]
members = [
    "crates/cli",
    "crates/credentials",
    "crates/domain",
    "crates/engine",
    "crates/ports",
    "crates/storage-sqlite",
    "crates/telegram",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LeeKai233/codex-telegram-bridge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
fs2 = "0.4"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.39", features = ["bundled"] }
libc = "0.2"
