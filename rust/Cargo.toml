[workspace]
members = [
    "crates/cli",
    "crates/credentials",
    "crates/domain",
    "crates/engine",
    "crates/ports",
    "crates/app-server",
    "crates/storage-sqlite",
    "crates/telegram",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LeeKai233/codex-telegram-bridge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
data-encoding = "2.11"
sha1 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
fs2 = "0.4"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.39", features = ["bundled"] }
libc = "0.2"
async-trait = "0.1"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
