[workspace]
members = [
    "crates/domain",
    "crates/engine",
    "crates/ports",
    "crates/storage-sqlite",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LeeKai233/codex-telegram-bridge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
