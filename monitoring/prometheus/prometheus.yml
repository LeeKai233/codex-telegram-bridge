global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    service: codex-telegram-bridge
    monitor: local

rule_files:
  - alerts/bridge.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  # Both implementations bind metrics to loopback. Change only the target
  # addresses when a deployment intentionally uses different local ports.
  - job_name: codex-telegram-bridge
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9464
        labels:
          implementation: python
      - targets:
          - 127.0.0.1:9465
        labels:
          implementation: rust-vnext
